<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hint Happens Moderation</title><style>body{font:15px system-ui;background:#141526;color:#f7f4ff;margin:0;padding:20px}main{max-width:1000px;margin:auto}section{background:#24263e;padding:16px;border-radius:14px;margin:14px 0;overflow:auto}input,button,select{padding:9px;border-radius:8px;margin:4px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #484a70;padding:8px;text-align:left;vertical-align:top}button{cursor:pointer}.blocked{color:#ff768c}.allowed{color:#75e2b5}</style></head><body><main><h1>🛡️ Hint Happens — Moderation</h1><p>Anonymous sign-in; records are only accessible to IDs in moderation_admins.</p><label>Supabase URL <input id="url" placeholder="https://project.supabase.co"></label><label>Anon key <input id="key" placeholder="public anon key"></label><button id="login">Sign in</button><button id="load">Load data</button><p id="status"></p><section><h2>Chat attempts (10-day retention)</h2><table><thead><tr><th>Player</th><th>Result</th><th>Terms</th><th>Count</th><th>Excerpt</th><th>Timestamp</th></tr></thead><tbody id="events"></tbody></table></section><section><h2>Users / IPs (10-day retention)</h2><table><thead><tr><th>Name</th><th>User ID</th><th>IP</th><th>Last seen</th><th>Expires</th></tr></thead><tbody id="users"></tbody></table></section><section><h2>Terms</h2><input id="term" placeholder="Word or phrase"><select id="type"><option value="word">Word</option><option value="phrase">Phrase</option></select><button id="add">Add term</button><table><thead><tr><th>Term</th><th>Type</th><th>Enabled</th><th></th></tr></thead><tbody id="terms"></tbody></table></section></main><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const $=x=>document.getElementById(x);let c;const esc=x=>String(x??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]));function client(){return c||(c=createClient($("url").value.trim(),$("key").value.trim()))}async function auth(){const {data:{session}}=await client().auth.getSession();if(!session){const {error}=await client().auth.signInAnonymously();if(error)throw error}}async function call(action,extra={}){const {data,error}=await client().functions.invoke("moderate-chat",{body:{action,...extra}});if(error)throw error;if(!data.ok)throw Error(data.message||"Access denied");return data}
$("login").onclick=async()=>{try{await auth();$("status").textContent="Authenticated; admin permission required to load records."}catch(e){$("status").textContent=e.message}};
$("load").onclick=async()=>{try{await auth();const d=await call("admin");$("events").innerHTML=d.events.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td class="'+esc(x.event_type)+'">'+esc(x.event_type)+'</td><td>'+esc((x.flagged_terms||[]).join(", "))+'</td><td>'+esc(x.flagged_word_count)+'</td><td>'+esc(x.message_excerpt)+'</td><td>'+esc(x.created_at)+'</td></tr>').join("");$("users").innerHTML=d.users.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td>'+esc(x.user_id)+'</td><td>'+esc(x.ip_address)+'</td><td>'+esc(x.last_seen_at)+'</td><td>'+esc(x.expires_at)+'</td></tr>').join("");$("terms").innerHTML=d.terms.map(x=>'<tr><td>'+esc(x.term)+'</td><td>'+esc(x.term_type)+'</td><td>'+esc(x.enabled)+'</td><td><button data-id="'+esc(x.id)+'" data-on="'+esc(x.enabled)+'">'+(x.enabled?"Disable":"Enable")+'</button></td></tr>').join("");$("terms").querySelectorAll("button").forEach(b=>b.onclick=async()=>{try{await call("term-toggle",{id:b.dataset.id,enabled:b.dataset.on!=="true"});$("load").click()}catch(e){$("status").textContent=e.message}});$("status").textContent="Loaded"}catch(e){$("status").textContent=e.message}};
$("add").onclick=async()=>{try{await auth();await call("term-add",{term:$("term").value,termType:$("type").value});$("term").value="";$("load").click()}catch(e){$("status").textContent=e.message}};
</script></body></html>
